name: idea_manager
description: A personal idea management app — offline-first, privacy-focused.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Local database
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.9.0

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2

  # UI / UX
  google_fonts: ^6.2.1
  flutter_slidable: ^3.0.1

  # Export / Share
  share_plus: ^7.2.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Allows SQLite unit tests to run on desktop/CI without an Android device
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
